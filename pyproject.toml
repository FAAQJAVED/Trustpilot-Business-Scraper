[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "trustpilot-business-scraper"
version         = "1.2.0"
description     = "A production-grade scraper for Trustpilot — extracts business contact data from any search query and saves to Excel."
authors         = [{name = "Afaq", email = ""}]
requires-python = ">=3.10"
readme          = "README.md"
license         = {text = "MIT"}
keywords        = ["trustpilot", "scraper", "business-directory", "lead-generation", "web-scraping"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "selenium>=4.18.0",
    "webdriver-manager>=4.0.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "pynput>=1.7.6",
    "urllib3>=2.0.0",
    "tqdm>=4.65.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 120
exclude     = [".git", "__pycache__", "scraper_clean_profile", ".venv", "dist", "build"]

[tool.ruff.lint]
select  = ["E", "F", "W", "I"]
ignore  = ["E501"]
